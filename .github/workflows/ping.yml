name: ping

# Sveglia pianificata per il workflow "agenda" di un repository privato.
#
# Perche' esiste: GitHub salta o rimanda spesso gli "schedule" sui repository
# privati con poca attivita' (8 e 9 settembre 2026: nessun run partito da solo).
# Sui repository pubblici gli schedule sono molto piu' affidabili, quindi questo
# repo fa da sveglia e manda un repository_dispatch al repo privato.
#
# Qui dentro non c'e' nulla di riservato: sia il nome del repo di destinazione
# sia il token stanno nei Secrets.

on:
  schedule:
    # Tre tentativi ravvicinati: se GitHub salta un'occorrenza, ne resta un'altra.
    # Il controllo anti-doppione fa si' che il run parta comunque una volta sola.
    - cron: "31 4 * * *"   # 06:31 ora legale italiana
    - cron: "46 4 * * *"
    - cron: "1 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true = manda la sveglia anche se un run di oggi c'e' gia' (per provare il dispatch)"
        default: "false"

# La sveglia non tocca questo repository: il token interno non le serve.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sveglia il workflow agenda
        env:
          GH_TOKEN: ${{ secrets.TARGET_TOKEN }}
          TARGET: ${{ secrets.TARGET_REPO }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Secret TARGET_TOKEN mancante"; exit 1; }
          test -n "${TARGET:-}"   || { echo "Secret TARGET_REPO mancante"; exit 1; }

          # Il token vede il repository? Un token fine-grained che non ha accesso
          # riceve 404 (non 403): GitHub non rivela l'esistenza dei repo privati.
          if ! gh api "repos/$TARGET" --jq .full_name >/dev/null 2>&1; then
            echo "ERRORE: il token non vede il repository di destinazione."

            # Restringiamo il campo: il token e' valido? e vede i repo pubblici?
            if CHI=$(gh api user --jq .login 2>/dev/null); then
              echo "  Il token e' valido e appartiene a: $CHI"
              if gh api "repos/$GITHUB_REPOSITORY" --jq .full_name >/dev/null 2>&1; then
                echo "  Vede questo repository, che e' pubblico, ma non la destinazione, che e' privata."
                echo "  => quasi certamente Repository access e' rimasto su \"Public repositories\","
                echo "     oppure fra i repository selezionati c'e' quello sbagliato."
              else
                echo "  Non vede nemmeno questo repository: il token non ha accesso a nulla di utile."
              fi
            else
              echo "  Il token non e' valido: scaduto, revocato, o incollato male."
            fi

            echo "Controlla, nelle impostazioni del token:"
            echo "  - Repository access = Only select repositories, con il repo selezionato"
            echo "    (il valore predefinito e' \"Public repositories\", che NON basta: il repo e' privato)"
            echo "  - Permissions: Contents = Read and write, Actions = Read-only"
            echo "  - che il token non sia scaduto o revocato"
            exit 1
          fi
          echo "Repository visibile al token: ok."

          OGGI=$(date -u +%Y-%m-%d)

          # Se un run di oggi c'e' gia' (il cron interno ha funzionato, oppure il
          # trigger locale sul Mac ha gia' fatto il suo lavoro) non ne lanciamo un altro.
          # Serve il permesso Actions = Read-only; se manca, lo diciamo e proseguiamo:
          # meglio un run in piu' (il workflow di destinazione e' idempotente e ha
          # concurrency) che un'agenda non aggiornata.
          RUNS=$(gh api "repos/$TARGET/actions/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.name==\"agenda\") | select(.created_at | startswith(\"$OGGI\"))] | length" 2>/dev/null)

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Richiesta forzata: mando il dispatch comunque."
          elif [ -z "$RUNS" ]; then
            echo "ATTENZIONE: non riesco a leggere i run (manca il permesso Actions = Read-only?)."
            echo "Mando il dispatch senza il controllo anti-doppione."
          elif [ "$RUNS" -gt 0 ]; then
            echo "Run gia' presente per oggi ($OGGI): non serve la sveglia."
            exit 0
          else
            echo "Nessun run per oggi ($OGGI): mando il dispatch."
          fi

          # Si lancia il workflow per nome: serve "Actions = Read and write". Di proposito NON
          # usiamo repos/$TARGET/dispatches, che richiederebbe "Contents = Read and write",
          # cioe' il permesso di riscrivere il codice del repository di destinazione: un token
          # rubato potrebbe farci girare codice qualunque con i segreti che quel repo contiene.
          if ERR=$(gh workflow run agenda --repo "$TARGET" -f apply=true -f revoke=false 2>&1); then
            echo "Sveglia inviata."
            exit 0
          fi

          # RIPIEGO TEMPORANEO, da togliere appena il token ha i permessi giusti.
          echo "Risposta di GitHub al tentativo di lanciare il workflow:"
          echo "$ERR" | sed 's/^/    /'
          echo "ATTENZIONE: non riesco a lanciare il workflow."
          echo "ATTENZIONE: ripiego sul vecchio dispatch, che richiede il permesso piu' ampio Contents = Read and write."
          echo "ATTENZIONE: aggiorna i permessi del token, poi questo ripiego va rimosso."
          if ! gh api "repos/$TARGET/dispatches" -f event_type=run-agenda --silent; then
            echo "ERRORE: anche il ripiego e' stato rifiutato. Il repository di destinazione non e' stato svegliato."
            exit 1
          fi
          echo "Sveglia inviata (col ripiego)."
